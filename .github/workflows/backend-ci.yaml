name: Backend CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [booking-service, matching-service, notify-service]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: ${{ matrix.service }}
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/dummy
        run: python -m pytest

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:latest

  deploy:
    needs: test-and-build
    if: github.event_name == 'push'
    runs-on: self-hosted
    strategy:
      matrix:
        include:
          - service: booking-service
            deployment: booking-deployment
          - service: matching-service
            deployment: matching-deployment
          - service: notify-service
            deployment: notify-deployment
    steps:
      - name: Roll out the new image
        run: |
          kubectl set image deployment/${{ matrix.deployment }} ${{ matrix.service }}=${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:latest
          kubectl rollout status deployment/${{ matrix.deployment }}