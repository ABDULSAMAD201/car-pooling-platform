apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: carpool-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: carpool.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: booking-service
                port:
                  number: 8000