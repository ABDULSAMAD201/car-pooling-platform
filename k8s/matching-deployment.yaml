apiVersion: apps/v1
kind: Deployment
metadata:
  name: matching-deployment
  labels:
    app: matching
spec:
  replicas: 1
  selector:
    matchLabels:
      app: matching
  template:
    metadata:
      labels:
        app: matching
    spec:
      containers:
        - name: matching-service
          image: abdulsamad099/matching-service:latest
          imagePullPolicy: Always  # now pulling from Docker Hub, refreshed by CD on every deploy
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          ports:
            - containerPort: 8001
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 5
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: matching-secret
                  key: DATABASE_URL
            - name: BOOKING_SERVICE_URL
              value: "http://booking-service:8000"
---
apiVersion: v1
kind: Service
metadata:
  name: matching-service
spec:
  selector:
    app: matching
  ports:
    - port: 8001
      targetPort: 8001